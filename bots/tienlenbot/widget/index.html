<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tiến lên miền nam</title>
<script>
  (function () {
    var path = window.location.pathname;
    if (!path.endsWith('/')) {
      var last = path.split('/').pop() || '';
      path = last.includes('.') ? path.replace(/[^/]*$/, '') : path + '/';
    }
    window.__tienlenAsset = function (name) { return window.location.origin + path + name; };

    /*
     * Thử lại với một cái khoá cache **chưa ai từng xin**, chứ không phải thử lại y nguyên.
     *
     * Thứ hỏng ở đây không phải cái mạng lúc này mà là **một bản hỏng đã bị đóng băng**, và đã
     * bắt được tận tay: server trả `404` kèm `cache-control: public, max-age=31536000,
     * immutable`, CDN cache đúng cái 404 ấy, rồi trả `HIT` cho mọi request sau đó. Một cú 404
     * thoáng qua — lúc bundle vừa upload chưa kịp đọc được — thành một cái khung trắng **kéo
     * dài một năm** cho mọi người đi qua edge đó, trong khi edge khác vẫn tốt.
     *
     * Nên khoá phải **ngẫu nhiên mỗi lần**, không phải `r=1`, `r=2`, `r=3`. Một khoá cố định là
     * một khoá cũng đóng băng được: đúng lúc viết những dòng này, `?r=1` của `tienlen.js` đang
     * là một cái 404 vĩnh viễn ở một edge — vì có người bấm thử đúng nó, đúng một lần, sai thời
     * điểm. Ngẫu nhiên thì không có URL nào để mà đóng băng trước.
     */
    window.__tienlenRetry = function (name, round) {
      if (!round) return window.__tienlenAsset(name);
      var fresh = round + '-' + Date.now().toString(36)
        + '-' + Math.random().toString(36).slice(2, 8);
      return window.__tienlenAsset(name) + '?r=' + fresh;
    };

    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = window.__tienlenAsset('style.css');
    // Mất stylesheet thì trang vẫn chạy, chỉ là xấu — nhưng "xấu" ở đây là chữ đen trên nền
    // trắng, mà nền trắng chính là thứ người ta gọi điện báo. Nên nó cũng thử lại.
    css.onerror = function () {
      var round = (css.__round || 0) + 1;
      if (round > 3) return;
      var again = document.createElement('link');
      again.rel = 'stylesheet';
      again.href = window.__tienlenRetry('style.css', round);
      again.__round = round;
      again.onerror = css.onerror;
      css = again;
      document.head.appendChild(again);
    };
    document.head.appendChild(css);
  }());
</script>

<!-- Four screens in one page, one of them showing at a time, inside a shell that never moves:
     who you are and what you have at the top, what to do at the bottom, the game in between.
     Built up front rather than written into innerHTML on every push — a hand of thirteen cards
     redrawn from a string every time somebody else plays loses which card was half-selected
     under the reader's thumb. -->
<div id="app">

  <!-- Always there, from the first frame, whatever screen is showing. What is in the purse is
       the number every other number in here is about, and hunting for it is not a thing anybody
       should have to do. -->
  <header id="purse">
    <span class="me-face" id="me-face"></span>
    <span class="me-name" id="me-name"></span>
    <span class="purse-gold" id="purse-gold"><i class="coin"></i><b class="amount" id="purse-amount">…</b></span>
    <button class="purse-add" id="purse-add" hidden>+</button>
  </header>

  <main id="screen">
    <!-- Choosing what to play, one question at a time.
         Built in JS rather than written out here, because it is a *flow*: two ways in, then how
         many seats, then what for. Laying all of that out at once was eleven buttons on the
         first thing anybody sees. -->
    <section id="menu" hidden>
      <div id="menu-body"></div>
    </section>

    <!-- Tables anybody has open, and the board. -->
    <section id="browse" hidden></section>

    <!-- The advertisement. Its own screen because that is what an advertisement is: the thing
         you are looking at instead of the thing you wanted. -->
    <section id="ads" hidden></section>

    <!-- Bầu cua tôm cá: the bowl, the board, and the chips. Its own section rather than a mode
         of the felt — one is a card table seen from your chair and the other is a mat seen from
         above, and nothing about the two layouts is the same. -->
    <section id="baucua" hidden>
      <div id="bowl">
        <div id="dice"></div>
        <!-- The plate over the bowl. The dice are decided and the gold has moved; nothing on
             this screen says so until somebody lifts it. -->
        <div id="plate" hidden><span>NẶN</span></div>
        <div id="bowl-note"></div>
      </div>
      <nav id="bc-tabs"></nav>
      <div id="board"></div>
      <div id="history" hidden></div>
      <div id="chips"></div>
    </section>

    <!-- Tài xỉu: một cái bát, ba con xúc xắc, và cái tổng của chúng. Màn riêng chứ không phải
         một kiểu khác của chiếu bầu cua — ở kia đặt vào một *mặt*, ở đây đặt vào một *câu nói về
         con số*, và hai thứ ấy không xếp giống nhau ở chỗ nào cả. -->
    <section id="taixiu" hidden>
      <!-- Ba con là thứ **duy nhất** nằm trong dòng chảy của cái bát, nên chúng nằm đúng giữa
           nó. Mọi chữ nghĩa — cái tổng, hàng người chơi, dòng dưới cùng — nằm trong một khối
           dán xuống đáy, và cái bát chừa sẵn chỗ cho khối ấy bằng `padding-bottom`. Để chúng
           trong dòng thì ba con bị đẩy lên sát mép trên, mà cái đĩa lại căn giữa bát: cái đĩa
           lệch khỏi ba con ba chục pixel và hở nguyên mép trên. -->
      <div id="tx-bowl">
        <div id="tx-dice"></div>
        <!-- Nắp bát. Che cả kết quả chứ không riêng ba con — cái ví ở ngay trên đầu và cửa
             thắng ở ngay dưới, mà chỗ nào trong số đó cũng nói trước được. -->
        <div id="tx-bat" hidden><span>NẶN</span></div>
        <!-- Mọi chữ nghĩa của cái bát, trong một khối dán xuống đáy: hàng người chơi ở trên,
             rồi một dòng duy nhất cho cái tổng và lời nói được mất — "11 Tài · +2.000 vàng", hai
             nửa của cùng một câu. **Đè lên phần chừa sẵn của cái bát**, không phải một hàng
             riêng trong cột: cột này chỉ có cái bát là co được, nên mỗi hàng thêm vào nó là một
             hàng đẩy cả cột qua ngưỡng — và tràn ở đây nghĩa là vẽ đè lên hàng nút ở đáy trang. -->
        <div id="tx-below">
          <div id="tx-line">
            <!-- Cái tổng, to hết cỡ: toàn bộ trò này là con số ấy. -->
            <div id="tx-sum" hidden></div>
            <div id="tx-note"></div>
          </div>
        </div>
      </div>
      <nav id="tx-tabs"></nav>
      <div id="tx-board"></div>
      <div id="tx-rule"></div>
      <div id="tx-cau" hidden></div>
      <div id="tx-help" hidden></div>
      <div id="tx-chips"></div>
    </section>

    <!-- Cờ vua và cờ tướng, một màn cho cả hai. Ngược với hai cái bát: hai bàn cờ khác nhau ở
         mọi quân và mọi luật, mà giống nhau ở **toàn bộ cách ngồi** — hai người, đi luân phiên,
         một lưới ô, chạm quân rồi chạm ô. Cái khác nhau nằm gọn trong ba con số và một hàm vẽ
         quân, nên nó là một màn với ba con số. -->
    <section id="boardgame" hidden>
      <div id="board-them" class="board-seat"></div>
      <div id="board-wrap">
        <div id="grid" class="grid"></div>
        <!-- Tốt tới hàng cuối. Nổi lên trên bàn chứ không đẩy bàn đi chỗ khác — cùng một luật
             với dòng nhắn: thứ chỉ hiện đôi lúc thì không nằm trong dòng chảy. -->
        <div id="promo" hidden></div>
        <div id="board-over" hidden></div>
      </div>
      <div id="board-me" class="board-seat"></div>
      <div id="board-bar"></div>
    </section>

    <!-- A table: the felt, whoever is round it, and whatever is in the middle. The same element
         through the waiting and the playing, because a seat filling up while you look at it is
         what makes a waiting room feel like a table rather than a form. -->
    <section id="table" hidden>
      <div id="felt">
        <div id="felt-top"></div>
        <div id="seats"></div>
        <!-- The pile and the line naming who played it, as one thing in the middle. Two
             absolutely placed elements drifted apart the moment a fourth seat wanted the
             bottom of the felt. -->
        <div id="middle">
          <div id="pile"></div>
          <div id="pile-note"></div>
        </div>
        <div id="result" hidden></div>
        <!-- Lá vừa bốc lên, phóng to để nặn. Nằm trong felt chứ không phủ cả trang: nó là một
             khoảnh khắc, và cái bàn bên dưới vẫn phải bấm được. -->
        <div id="peek" hidden></div>
      </div>
      <div id="mine">
        <div id="mine-bar"></div>
        <div id="hand"></div>
      </div>
    </section>
  </main>

  <!-- The only place anything can be said. A widget cannot open a dialog — `alert` and
       `confirm` are blocked by the sandbox and hand back at once. -->
  <div id="says"></div>

  <div id="buttons"></div>

  <!-- Where to go, at the bottom where a thumb is. Only while there is somewhere to go: in a
       game there is one thing on this frame, which is the game. -->
  <nav id="tabs"></nav>
</div>

<!-- Put into every bundle by the platform. Loaded before the game so window.Zeplao is there
     whether this is running on a phone or in a browser. -->
<!-- Trước `tienlen.js`, không phải sau. `render()` bên kia gọi tới mấy hàm ở đây, mà khai báo hàm
     thì được hoist ra toàn cục ngay khi file này chạy xong; còn thứ file này đọc của bên kia thì
     chỉ đọc trong lòng hàm, tức là lúc đã chạy rồi. Ngược lại thì `z.ready()` ở cuối `tienlen.js`
     có thể gọi vào một hàm chưa tồn tại.

     Firefox resolves relative assets against `/api/widgets/<bot>/<version>` as if `version` were
     a file when the URL has no trailing slash. The host can hand us exactly that URL, so load the
     bundle from the computed version directory instead of leaving static tags for the parser. -->
<script>
  (function () {
    var files = ['zeplao.js', 'faces.js', 'sound.js', 'pieces.js', 'board.js', 'taixiu.js', 'tienlen.js'];

    /*
     * Bảy file nạp nối đuôi nhau, và **cái dây ấy không được phép đứt trong im lặng**.
     *
     * Nó chỉ nối tiếp ở `onload`, nên một file không tải được là dừng ngay tại đó: `tienlen.js`
     * không bao giờ chạy, `z.ready()` không bao giờ gọi, host chờ mãi — và cái người ta nhìn
     * thấy là một cái khung **trắng bóc**, không một dòng lỗi ở đâu, không log, không gì. Không
     * ai chẩn được nó, kể cả người viết ra nó: nó im lặng đúng ở chỗ cần phải kêu.
     *
     * Nên ba việc, theo thứ tự đó:
     *
     *   1. **Thử lại**, tới ba lần, mỗi lần một khoá cache khác. Thứ hỏng thường không phải
     *      cái mạng lúc này mà là một bản hỏng đã nằm trong cache của một edge CDN — xin lại
     *      đúng URL cũ là nhận lại đúng cái hỏng cũ.
     *   2. **Bỏ qua file không thiết yếu**. Tiếng xúc xắc hay bộ mặt mà thiếu thì bàn xấu đi
     *      chứ không chết; dừng cả trang vì một file trang trí là đổi một lỗi nhỏ lấy một lỗi
     *      to nhất có thể.
     *   3. Còn hai file **không thiếu được** — cái cầu sang app và chính trò chơi — thì nói ra
     *      thành chữ trên màn hình, kèm tên file. Một câu tiếng Việt bao giờ cũng hơn một màn
     *      trắng, cho cả người chơi lẫn người sắp phải đi tìm.
     */
    var NEEDED = { 'zeplao.js': 1, 'tienlen.js': 1 };

    /*
     * Và **nạp xong không có nghĩa là có gì trong đó**.
     *
     * Một file trả về 200 với thân rỗng hay cụt thì `onerror` không kêu một tiếng: trình duyệt
     * coi như nạp xong, `onload` chạy, dây đi tiếp — rồi trang chết ở một chỗ chẳng liên quan,
     * hoặc không chết mà chỉ đơn giản là không bao giờ gọi `z.ready()`. Vẫn đúng cái khung trắng
     * ấy, lần này còn khó tìm hơn.
     *
     * Không phải chuyện lý thuyết: file của bộ này được phục vụ kèm `immutable` và hạn một năm,
     * nên một phản hồi hỏng chộp đúng lúc là một phản hồi hỏng **nằm lại một năm** ở đúng cái
     * edge ấy, còn người ở edge khác thì không thấy gì cả.
     *
     * Nên hai file sống còn phải **chứng minh là chúng thật sự đã chạy**: mỗi cái để lại một cái
     * tên ở tầng toàn cục, và không thấy cái tên ấy thì coi như chưa nạp — thử lại bằng một khoá
     * cache khác, y như khi tải hỏng.
     */
    var LEFT_BEHIND = { 'zeplao.js': 'Zeplao', 'tienlen.js': 'drawMenu' };

    function took(name) {
      var mark = LEFT_BEHIND[name];
      return !mark || typeof window[mark] !== 'undefined';
    }

    /*
     * Và **hỏng không phải kiểu duy nhất**: một request có thể chỉ đơn giản là **không bao giờ
     * trả lời**. Treo thì `onload` không kêu mà `onerror` cũng không, nên dây nạp đứng im vô hạn.
     *
     * Chỗ này đã sai hai lần, và cả hai lần đều vì **nhầm chậm với treo**:
     *
     *   - Bản đầu: quá ba giây thì bỏ cái đang treo, tạo thẻ mới. Cái thẻ cũ về đích sau, và
     *     file chạy **hai lần** — `SyntaxError: Identifier ... has already been declared`, chết
     *     chắc hơn cả lúc treo.
     *   - Bản thứ hai: quá ba giây thì nạp lại cả trang. Trên một cái máy điện thoại mạng yếu,
     *     ba giây là **thời gian tải bình thường** của một file trăm ki-lô-bai — nên nó nạp lại
     *     giữa chừng, và trên điện thoại thì app đẩy trạng thái vào **một lần** lúc trang mở:
     *     nạp lại là mất luôn cái state ấy. Đo bằng webview giả lập ở 60 kbps: trang tự nạp
     *     lại, `tienlen.js` không bao giờ chạy, người dùng nhận một cái thẻ báo lỗi thay vì bàn.
     *
     * Nên: **đồng hồ để rất rộng** (bốn mươi lăm giây), và
     * quá hạn thì cũng **không nạp lại trang, không tạo thẻ thứ hai cho cùng file**. File phụ
     * thì bỏ lại mà đi tiếp; file sống còn thì nói ra thành chữ và để **người dùng** bấm tải
     * lại — một cái nạp lại do người ta chọn thì không cướp mất thứ gì của ai.
     *
     * Cái ngưỡng để hở cho bộ thử chỉnh, vì một bộ thử phải chờ hai mươi giây mỗi cảnh là một
     * bộ thử không ai chạy.
     */
    /*
     * Bốn mươi lăm giây, và con số ấy đo ra chứ không nghĩ ra.
     *
     * Cả bộ nặng hơn ba trăm ki-lô-bai. Trên một đường 60 kbps — đo bằng webview giả lập — nguyên
     * bộ mất **khoảng 55 giây**, và riêng file to nhất mất gần hai mươi. Đặt ngưỡng ở hai mươi
     * giây là bắn vào đúng cái file đang tải bình thường của một cái máy mạng yếu, tức là đúng
     * người cần được kiên nhẫn nhất. Bốn mươi lăm giây thì một đường 3G tử tế (cả bộ ~2 giây)
     * không bao giờ chạm tới, còn một cái treo thật thì vẫn có người nói cho biết.
     */
    var STALLED_MS = window.__tienlenStallMs || 45000;

    function load(i, round) {
      if (i >= files.length) return;

      var name = files[i];
      var script = document.createElement('script');
      var settled = false;
      var clock = null;

      // Hỏng hẳn, hay nạp xong mà rỗng ruột. Cả hai đều an toàn để xin lại bằng thẻ mới: cái
      // trước hoặc chưa chạy, hoặc chạy rồi mà trong ruột không có gì.
      var failed = function () {
        if (settled) return;
        settled = true;
        clearTimeout(clock);
        if (round < 3) { setTimeout(function () { load(i, round + 1); }, 200 * (round + 1)); return; }
        if (!NEEDED[name]) { load(i + 1, 0); return; }
        stuck(name);
      };

      // Treo. Cái thẻ cũ vẫn còn sống nên không được xin lại cùng file, và cũng không nạp lại
      // trang — chỉ đi tiếp, hoặc chịu thua và nói ra.
      var stalled = function () {
        if (settled) return;
        settled = true;
        if (!NEEDED[name]) { load(i + 1, 0); return; }
        stuck(name);
      };

      script.src = window.__tienlenRetry(name, round);
      script.onload = function () {
        if (settled) return;
        if (!took(name)) { failed(); return; }
        settled = true;
        clearTimeout(clock);
        load(i + 1, 0);
      };
      script.onerror = failed;
      clock = setTimeout(stalled, STALLED_MS);

      document.body.appendChild(script);
    }

    // Kiểu viết thẳng vào thẻ, vì lúc này rất có thể chính stylesheet cũng là thứ không tải nổi.
    function stuck(name) {
      var box = document.createElement('div');
      box.setAttribute('style', 'position:fixed;inset:0;display:flex;flex-direction:column;'
        + 'align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;'
        + 'background:#072318;color:#cfe0d6;font:14px/1.5 -apple-system,BlinkMacSystemFont,'
        + '"Segoe UI",Roboto,sans-serif');
      var what = document.createElement('div');
      what.textContent = 'Không tải được ' + name + '.';
      var how = document.createElement('div');
      how.setAttribute('style', 'font-size:12px;opacity:.75');
      how.textContent = 'Mạng hoặc bộ nhớ đệm đang giữ một bản hỏng. Bấm để thử lại.';
      var again = document.createElement('button');
      again.setAttribute('style', 'font:inherit;font-weight:650;padding:8px 18px;border:0;'
        + 'border-radius:10px;background:#e9c46a;color:#08251a;cursor:pointer');
      again.textContent = 'Tải lại';
      again.onclick = function () { window.location.reload(); };
      box.appendChild(what); box.appendChild(how); box.appendChild(again);
      document.body.appendChild(box);
    }

    load(0, 0);
  }());
</script>
